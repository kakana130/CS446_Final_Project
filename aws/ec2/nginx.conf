# nginx on the EC2 instance (installed by aws/ec2/setup.sh as /etc/nginx/nginx.conf).
# Visitors connect to port 80; nginx passes each request to the app on 127.0.0.1:3000 and
# tells it the visitor's real IP (used, hashed, for rate limits).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;
    # The app promises not to keep raw IP addresses, so nginx keeps no access log either.
    access_log off;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Plate photo uploads (one cropped plate per request, well under this).
        client_max_body_size 5m;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwritten, never appended: a visitor can't fake their IP with these headers.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
