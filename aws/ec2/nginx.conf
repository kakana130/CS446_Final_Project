# nginx on each EC2 instance (installed by aws/ec2/setup.sh as /etc/nginx/nginx.conf).
# The Application Load Balancer sends visitors' requests to port 80; nginx passes each one to
# the app on 127.0.0.1:3000 and tells it the visitor's real IP (used, hashed, for rate limits).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;
    # The app promises not to keep raw IP addresses, so nginx keeps no access log either.
    access_log off;

    # Behind the load balancer every connection comes from the ALB's private address, and the
    # visitor's IP is the last entry the ALB appended to X-Forwarded-For. Trust that header only
    # when the connection itself comes from inside the VPC (private ranges), so a visitor who
    # reaches the instance directly can't pick their own IP. $remote_addr below is then the
    # visitor, with or without the load balancer in front.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Plate photo uploads (one cropped plate per request, well under this).
        client_max_body_size 5m;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Overwritten, never appended: a visitor can't fake their IP with these headers.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
